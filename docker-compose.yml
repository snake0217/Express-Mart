version: '3.9'

# Infraestructura basada en contenedores con soporte de autoescalado y alta disponibilidad (Apartado 13, 34, RNF-08)
services:
  expressmart-api:
    build: .
    image: expressmart-ecommerce:1.0.0
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_VERSION=1.0.0
      - PAYMENT_GATEWAY_TIMEOUT_MS=30000
      - PAYMENT_GATEWAY_MAX_RETRIES=3
    volumes:
      - expressmart_data:/app/data
      - expressmart_backups:/app/backups
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

volumes:
  expressmart_data:
  expressmart_backups:
